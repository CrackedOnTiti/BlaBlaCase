version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - api/.env
    # Cloudflare Tunnel is run as a separate container or systemd service on the Pi.
    # It forwards public HTTPS traffic to localhost:8000.

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - api/.env
    command: ["python3", "-m", "api.scheduler"]
